<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dark:#1e2c2f;--dark2:#2d3b3e;--teal:#3a4a4e;--accent:#c9a84c;--accent2:#e8c56a;
  --bg:#f5f2ec;--white:#fff;--text:#2d3b3e;--muted:#6b7c80;--border:rgba(58,74,78,0.12);
  --green:#43A047;--success:#2e7d32;--danger:#c62828;--info:#1565c0;
}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden;}

/* ===== NAVBAR ===== */
nav{position:fixed;top:0;right:0;left:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:72px;background:rgba(30,44,47,0.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(201,168,76,0.15);transition:all .3s;}
nav.scrolled{height:62px;background:rgba(20,32,35,0.98);}
.nav-logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;text-decoration:none;}
.nav-logo-ar{font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;font-family:'Tajawal',sans-serif;}
.nav-logo-en{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:5px;opacity:.8;}
.nav-links{display:flex;align-items:center;gap:32px;}
.nav-links a{color:rgba(255,255,255,.65);font-size:14px;font-weight:600;text-decoration:none;transition:color .2s;cursor:pointer;}
.nav-links a:hover,.nav-links a.active{color:var(--accent);}
.nav-cta{background:var(--accent);color:var(--dark);border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,168,76,.35);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-provider-btn{color:rgba(255,255,255,.5);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;font-family:'Cairo',sans-serif;white-space:nowrap;}
.nav-provider-btn:hover{color:var(--accent);}

/* ===== HERO ===== */
.hero{min-height:100vh;background:var(--dark);display:flex;align-items:center;position:relative;overflow:hidden;padding:100px 60px 60px;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 80% 50%,rgba(58,74,78,0.5) 0%,transparent 70%),radial-gradient(ellipse 40% 50% at 10% 80%,rgba(201,168,76,0.07) 0%,transparent 60%);}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 70% 80% at 50% 50%,black 0%,transparent 80%);}
.hero-content{position:relative;z-index:2;max-width:620px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.25);border-radius:30px;padding:7px 16px;margin-bottom:28px;font-size:12px;font-weight:700;color:var(--accent);}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
/* ===== SEO: h1 رئيسي بكلمات مفتاحية مُحسَّنة ===== */
h1{font-family:'Tajawal',sans-serif;font-size:clamp(46px,5vw,72px);font-weight:900;line-height:1.1;color:#fff;letter-spacing:-2px;margin-bottom:14px;}
h1 span.accent{color:var(--accent);}
.hero-sub{font-size:18px;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:36px;font-weight:400;max-width:480px;}
.hero-actions{display:flex;align-items:center;gap:14px;margin-bottom:48px;}
.btn-primary{background:var(--accent);color:var(--dark);border:none;border-radius:14px;padding:16px 32px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;box-shadow:0 8px 32px rgba(201,168,76,.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(201,168,76,.4);}
.btn-secondary{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:15px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.btn-secondary:hover{background:rgba(255,255,255,.12);}
.hero-stats{display:flex;gap:32px;}
.stat-item{text-align:center;}
.stat-num{font-size:28px;font-weight:900;color:#fff;font-family:'Tajawal',sans-serif;}
.stat-num span{color:var(--accent);}
.stat-lbl{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;font-weight:600;}

/* Phone Frame */
.hero-visual{position:absolute;left:60px;top:50%;transform:translateY(-50%);z-index:2;}
.phone-frame{width:290px;height:580px;background:var(--dark2);border-radius:38px;border:2px solid rgba(255,255,255,.08);box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;position:relative;animation:float 7s ease-in-out infinite;}
.phone-notch{width:90px;height:28px;background:var(--dark);border-radius:0 0 18px 18px;margin:0 auto;position:relative;z-index:2;}
.phone-header{background:var(--dark2);padding:14px 14px 16px;color:#fff;text-align:center;}
.phone-header .plogo{font-size:22px;font-weight:900;font-family:'Tajawal',sans-serif;}
.phone-header .psub{font-size:8px;letter-spacing:4px;color:var(--accent);opacity:.8;}
.phone-body{padding:12px;background:var(--bg);}
.phone-section{font-size:11px;font-weight:700;color:var(--text);margin-bottom:8px;}
.phone-services{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.ps{background:#fff;border-radius:11px;padding:10px 6px;text-align:center;border:.5px solid var(--border);}
.ps-ico{font-size:20px;margin-bottom:4px;}
.ps-lbl{font-size:9px;font-weight:700;}
.phone-card{background:#fff;border-radius:12px;padding:11px;border:.5px solid var(--border);margin-bottom:8px;}
.pc-top{display:flex;gap:9px;align-items:center;margin-bottom:9px;}
.pc-ava{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.pc-name{font-size:12px;font-weight:700;}
.pc-spec{font-size:10px;color:var(--muted);}
.pc-stars{color:var(--accent);font-size:9px;}
.pc-bot{display:flex;justify-content:space-between;align-items:center;border-top:.5px solid var(--border);padding-top:8px;}
.pc-price{font-size:13px;font-weight:900;color:var(--dark2);}
.pc-btn{background:var(--dark2);color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:9px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;}
.float-badge{position:absolute;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:7px;border:.5px solid var(--border);white-space:nowrap;}
.fb-left{left:-90px;top:25%;animation:float 5s ease-in-out infinite;animation-delay:-2s;}
.fb-right{right:-80px;top:55%;animation:float 5s ease-in-out infinite;animation-delay:-1s;}
.fb-ico{font-size:16px;}
.fb-txt{font-size:11px;font-weight:700;color:var(--text);}
.fb-sub{font-size:9px;color:var(--muted);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

/* Trust Bar */
.trust-bar{background:var(--dark2);padding:18px 60px;display:flex;align-items:center;justify-content:center;gap:50px;border-top:1px solid rgba(201,168,76,.1);}
.trust-item{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.5);font-size:13px;font-weight:600;}
.trust-item strong{color:var(--accent);}

/* Sections */
.section{padding:90px 60px;}
.section-tag{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--accent);margin-bottom:12px;text-transform:uppercase;}
/* ===== SEO: h2 مع كلمات مفتاحية ===== */
.section-title{font-family:'Tajawal',sans-serif;font-size:clamp(32px,3.5vw,48px);font-weight:900;line-height:1.15;letter-spacing:-1px;margin-bottom:16px;}
.section-sub{font-size:16px;color:var(--muted);line-height:1.8;max-width:520px;}
.section-header{margin-bottom:52px;}

/* Services */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.svc-card{background:var(--white);border:.5px solid var(--border);border-radius:20px;padding:28px 24px;transition:all .25s;cursor:pointer;position:relative;overflow:hidden;}
.svc-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(45,59,62,.1);border-color:rgba(201,168,76,.25);}
.svc-ico-wrap{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;}
.svc-name{font-size:18px;font-weight:700;margin-bottom:8px;}
.svc-desc{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:16px;}
.svc-price{display:flex;align-items:baseline;gap:4px;}
.svc-from{font-size:12px;color:var(--muted);}
.svc-num{font-size:22px;font-weight:900;color:var(--dark);}
.svc-cur{font-size:13px;color:var(--muted);}
.popular-tag{position:absolute;top:18px;left:18px;background:var(--accent);color:var(--dark);font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}

/* How It Works */
.how-section{background:var(--dark);padding:90px 60px;position:relative;overflow:hidden;}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;position:relative;z-index:1;}
.step-card{text-align:center;padding:28px 20px;}
.step-num{width:56px;height:56px;border-radius:18px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--accent);margin:0 auto 16px;font-family:'Tajawal',sans-serif;}
.step-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;}
.step-desc{font-size:13px;color:rgba(255,255,255,.45);line-height:1.8;}

/* Doctors */
.doctors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.doc-card{background:var(--white);border:.5px solid var(--border);border-radius:20px;overflow:hidden;transition:all .25s;}
.doc-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(45,59,62,.1);}
.doc-header{background:var(--dark2);padding:24px;text-align:center;}
.doc-ava{width:80px;height:80px;border-radius:22px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px;}
.doc-name{font-size:17px;font-weight:700;color:#fff;}
.doc-spec{font-size:13px;color:rgba(255,255,255,.5);margin-top:3px;}
.doc-body{padding:18px;}
.doc-stars{color:var(--accent);font-size:14px;margin-bottom:8px;}
.doc-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.doc-badge{background:var(--bg);color:var(--text);border-radius:20px;font-size:11px;padding:5px 12px;font-weight:600;}
.doc-avail{font-size:12px;font-weight:700;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:5px;}
.doc-avail::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.doc-price-row{display:flex;justify-content:space-between;align-items:center;}
.doc-from{font-size:10px;color:var(--muted);}
.doc-price{font-size:22px;font-weight:900;color:var(--dark2);}
.doc-btn{background:var(--dark2);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:background .2s;}
.doc-btn:hover{background:var(--teal);}

/* Testimonials */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.testi-card{background:var(--white);border:.5px solid var(--border);border-radius:20px;padding:28px 24px;position:relative;}
.testi-card::before{content:'"';position:absolute;top:18px;left:24px;font-size:60px;color:var(--accent);opacity:.15;font-family:serif;line-height:1;}
.testi-stars{color:var(--accent);font-size:16px;margin-bottom:12px;}
.testi-text{font-size:15px;line-height:1.85;color:var(--text);margin-bottom:18px;}
.testi-author{display:flex;align-items:center;gap:10px;border-top:.5px solid var(--border);padding-top:14px;}
.testi-ava{width:38px;height:38px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;}
.testi-name{font-size:14px;font-weight:700;}
.testi-date{font-size:11px;color:var(--muted);}

/* Pricing */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.price-card{background:#fff;border:.5px solid var(--border);border-radius:20px;overflow:hidden;transition:all .2s;}
.price-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(45,59,62,.1);}
.price-card-header{padding:24px;text-align:center;}
.price-card-body{padding:20px;}
.price-range-box{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;}
.price-range-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.price-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.price-min{font-size:22px;font-weight:900;color:#2eb872;}
.price-max{font-size:22px;font-weight:900;color:var(--dark2);}
.price-note{font-size:11px;color:var(--muted);margin-top:8px;}

/* Sub-service grid */
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.sub-card{background:var(--white);border:.5px solid var(--border);border-radius:16px;padding:18px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden;}
.sub-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(45,59,62,.1);border-color:rgba(201,168,76,.25);}
.sub-name{font-size:14px;font-weight:700;margin-bottom:6px;}
.sub-duration{font-size:11px;color:var(--muted);margin-bottom:12px;}
.sub-price-row{display:flex;align-items:baseline;gap:3px;}
.sub-from{font-size:10px;color:var(--muted);}
.sub-price{font-size:20px;font-weight:900;color:var(--dark2);}
.sub-cur{font-size:11px;color:var(--muted);}
.svc-section{margin-bottom:60px;}
.svc-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.svc-section-left{display:flex;align-items:center;gap:14px;}
.svc-section-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.svc-section-name{font-family:'Tajawal',sans-serif;font-size:24px;font-weight:900;}
.svc-section-desc{font-size:13px;color:var(--muted);margin-top:3px;}
.svc-range{background:var(--dark);color:#fff;border-radius:10px;padding:8px 16px;text-align:center;}
.svc-range-lbl{font-size:10px;color:rgba(255,255,255,.4);font-weight:700;}
.svc-range-val{font-size:15px;font-weight:900;color:var(--accent);margin-top:2px;}

/* Coverage */
.coverage-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.coverage-card{background:#fff;border:.5px solid var(--border);border-radius:20px;padding:28px;}
.coverage-areas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.area-tag{background:var(--bg);color:var(--text);border-radius:20px;font-size:12px;padding:6px 14px;font-weight:600;}

/* FAQ */
.faq-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;cursor:pointer;font-size:15px;font-weight:700;color:#fff;transition:background .2s;}
.faq-q:hover{background:rgba(255,255,255,.04);}
.faq-arrow{font-size:12px;color:var(--accent);transition:transform .3s;flex-shrink:0;margin-right:12px;}
.faq-a{display:none;padding:0 20px 18px;font-size:14px;color:rgba(255,255,255,.55);line-height:1.85;}
.faq-item.open .faq-a{display:block;}
