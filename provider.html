<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاذ — داشبورد مقدم الخدمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dark:#1e2c2f;--dark2:#2d3b3e;--teal:#3a4a4e;--accent:#c9a84c;--accent2:#e8c56a;
  --bg:#f5f2ec;--white:#fff;--text:#2d3b3e;--muted:#6b7c80;--border:rgba(58,74,78,0.12);
  --green:#43A047;--success:#2e7d32;--danger:#c62828;--info:#1565c0;
  --sidebar:260px;
}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden;display:flex;min-height:100vh;}

/* ===== LOGIN ===== */
.login-wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);position:fixed;inset:0;z-index:1000;}
.login-card{background:var(--dark2);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px;width:400px;text-align:center;}
.login-logo{font-size:38px;font-weight:900;color:#fff;font-family:'Tajawal',sans-serif;margin-bottom:4px;}
.login-sub{font-size:11px;letter-spacing:3px;color:var(--accent);opacity:.8;margin-bottom:6px;}
.login-desc{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px;}
.login-input{width:100%;padding:13px 16px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;font-size:14px;font-family:'Cairo',sans-serif;background:rgba(255,255,255,.06);color:#fff;outline:none;margin-bottom:12px;}
.login-input::placeholder{color:rgba(255,255,255,.3);}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:var(--dark);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;margin-top:6px;}
.login-btn:hover{transform:translateY(-1px);}
.login-tabs{display:flex;gap:8px;margin-bottom:24px;}
.login-tab{flex:1;padding:10px;border:1.5px solid rgba(255,255,255,.1);border-radius:10px;background:transparent;color:rgba(255,255,255,.5);font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.login-tab.active{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.3);color:var(--accent);}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar);background:var(--dark);min-height:100vh;position:fixed;top:0;right:0;z-index:100;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.05);}
.sidebar-logo{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar-logo-ar{font-size:24px;font-weight:900;color:#fff;font-family:'Tajawal',sans-serif;}
.sidebar-logo-en{font-size:8px;letter-spacing:4px;color:var(--accent);opacity:.7;}
.sidebar-badge{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--accent);margin-top:5px;display:inline-block;}
.sidebar-provider-info{padding:16px 20px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.05);}
.prov-name{font-size:14px;font-weight:700;color:#fff;}
.prov-type{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.prov-avail{display:flex;align-items:center;gap:8px;margin-top:10px;}
.avail-label{font-size:12px;color:rgba(255,255,255,.5);}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-section{padding:0 20px;margin-bottom:4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:2px;text-transform:uppercase;margin-top:14px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:rgba(255,255,255,.5);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border-right:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);}
.nav-item.active{background:rgba(201,168,76,.1);color:var(--accent);border-right-color:var(--accent);}
.nav-item i{width:18px;text-align:center;font-size:14px;}
.nav-item .badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;margin-right:auto;}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.06);}

/* ===== MAIN ===== */
.main{margin-right:var(--sidebar);flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:18px;font-weight:700;color:var(--dark);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-btn{background:var(--dark);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.topbar-btn:hover{transform:translateY(-1px);}
.topbar-btn.accent{background:var(--accent);color:var(--dark);}

.content{padding:28px;flex:1;}

/* ===== PAGES ===== */
.page{display:none;}
.page.active{display:block;}

/* ===== CARDS ===== */
.card{background:var(--white);border-radius:16px;border:.5px solid var(--border);margin-bottom:20px;overflow:hidden;}
.card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:15px;font-weight:700;color:var(--dark);}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.card-body{padding:22px;}

/* ===== STATS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:14px;padding:18px;border:.5px solid var(--border);text-align:center;}
.stat-val{font-size:28px;font-weight:900;font-family:'Tajawal',sans-serif;color:var(--dark);}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:3px;}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;}
.form-input{padding:11px 14px;border:1.5px solid rgba(58,74,78,.15);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-hint{font-size:11px;color:var(--muted);}
.form-row{display:flex;align-items:center;gap:8px;}
.range-sep{font-size:12px;color:var(--muted);flex-shrink:0;}

/* ===== SECTION ===== */
.section-divider{font-size:13px;font-weight:700;color:var(--dark);padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-divider i{color:var(--accent);}

/* ===== SERVICE SELECT CARDS ===== */
.service-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.svc-type-card{border:2px solid var(--border);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;}
.svc-type-card:hover{border-color:rgba(201,168,76,.4);}
.svc-type-card.sel{border-color:var(--accent);background:rgba(201,168,76,.06);}
.svc-type-card .ico{font-size:28px;margin-bottom:8px;}
.svc-type-card .lbl{font-size:13px;font-weight:700;}
.svc-type-card .sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* ===== SUB-SERVICE CHECKBOXES ===== */
.sub-svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sub-svc-item{border:1.5px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:all .2s;background:#fff;}
.sub-svc-item.checked{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.04);}
.sub-svc-top{display:flex;align-items:center;justify-content:space-between;}
.sub-svc-name{font-size:13px;font-weight:700;}
.sub-svc-range{font-size:11px;color:var(--muted);}
.sub-svc-price{display:flex;align-items:center;gap:8px;margin-top:4px;}
.sub-svc-price label{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
.price-input{width:80px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Cairo',sans-serif;text-align:center;background:#fff;}
.price-input:focus{border-color:var(--accent);outline:none;}

/* ===== GRADE CARDS ===== */
.grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.grade-card{border:2px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;background:#fff;}
.grade-card.sel{border-color:var(--accent);background:rgba(201,168,76,.06);}
.grade-card .grade-ico{font-size:22px;margin-bottom:6px;}
.grade-card .grade-name{font-size:14px;font-weight:700;}
.grade-card .grade-desc{font-size:11px;color:var(--muted);margin-top:3px;}

/* ===== SPECIALTY SELECT ===== */
.specialty-wrap{background:rgba(58,74,78,.03);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}

/* ===== BOOKING CARD ===== */
.booking-card{background:#fff;border:.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.bc-info .bc-name{font-size:14px;font-weight:700;}
.bc-info .bc-svc{font-size:12px;color:var(--muted);margin-top:3px;}
.bc-info .bc-time{font-size:11px;color:var(--muted);margin-top:2px;}
.bc-right{text-align:left;flex-shrink:0;}
.bc-area{font-size:12px;color:var(--muted);}
.bc-actions{display:flex;gap:6px;margin-top:8px;}

/* ===== TOGGLE ===== */
.toggle{position:relative;display:inline-flex;width:46px;height:26px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#ddd;border-radius:26px;transition:.3s;}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;right:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.toggle input:checked + .toggle-slider{background:var(--green);}
.toggle input:checked + .toggle-slider::before{transform:translateX(-20px);}

/* ===== BADGE ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.green{background:rgba(67,160,71,.1);color:var(--success);}
.badge.red{background:rgba(198,40,40,.1);color:var(--danger);}
.badge.yellow{background:rgba(201,168,76,.12);color:#b8860b;}
.badge.blue{background:rgba(21,101,192,.1);color:var(--info);}
.badge.gray{background:rgba(107,124,128,.1);color:var(--muted);}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:20px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:700;}
.modal-close{background:var(--bg);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--muted);}
.modal-body{padding:22px;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* ===== BTN ===== */
.btn{border:none;border-radius:10px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.btn.primary{background:var(--dark);color:#fff;}
.btn.accent{background:var(--accent);color:var(--dark);}
.btn.ghost{background:var(--bg);color:var(--text);}

/* ===== ACT BTNS ===== */
.act-btn{border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .15s;}
.act-btn.edit{background:rgba(21,101,192,.1);color:var(--info);}
.act-btn.done{background:rgba(67,160,71,.1);color:var(--success);}
.act-btn.cancel{background:rgba(198,40,40,.1);color:var(--danger);}

/* ===== PRICE RANGE BADGE ===== */
.range-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;color:#b8860b;}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--dark);color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;transition:all .3s;pointer-events:none;white-space:nowrap;border:1px solid rgba(201,168,76,.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{border-color:rgba(67,160,71,.4);}
.toast.error{border-color:rgba(198,40,40,.4);}

/* ===== PENDING BADGE ===== */
.pending-count{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;align-items:center;justify-content:center;font-weight:700;margin-right:auto;}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .sidebar{transform:translateX(100%);transition:.3s;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-right:0;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .service-type-grid{grid-template-columns:1fr 1fr;}
  .sub-svc-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="login-logo">ملاذ</div>
    <div class="login-sub">مقدم الخدمة</div>
    <div class="login-desc">سجّل دخولك أو أنشئ حساب جديد</div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchLoginTab('login',this)">تسجيل الدخول</button>
      <button class="login-tab" onclick="switchLoginTab('register',this)">حساب جديد</button>
    </div>
    <!-- Login -->
    <div id="tab-login">
      <input class="login-input" type="email" id="p-email" placeholder="البريد الإلكتروني">
      <input class="login-input" type="password" id="p-pass" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doProviderLogin()">
      <div id="login-err" style="color:#ff6b6b;font-size:12px;margin-bottom:8px;display:none"></div>
      <button class="login-btn" onclick="doProviderLogin()"><i class="fas fa-sign-in-alt" style="margin-left:8px"></i> دخول</button>
    </div>
    <!-- Register -->
    <div id="tab-register" style="display:none">
      <input class="login-input" type="text" id="r-name" placeholder="الاسم الكامل *">
      <input class="login-input" type="email" id="r-email" placeholder="البريد الإلكتروني *">
      <input class="login-input" type="password" id="r-pass" placeholder="كلمة المرور *">
      <input class="login-input" type="tel" id="r-phone" placeholder="رقم الموبايل *" dir="ltr">
      <div id="register-err" style="color:#ff6b6b;font-size:12px;margin-bottom:8px;display:none"></div>
      <button class="login-btn" onclick="doRegister()"><i class="fas fa-user-plus" style="margin-left:8px"></i> إنشاء حساب</button>
      <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:12px">سيتم مراجعة طلبك من الأدمن قبل التفعيل</div>
    </div>
  </div>
</div>

<!-- ===== PROVIDER APP ===== -->
<div id="provider-app" style="display:none;width:100%;display:none;flex-direction:row;">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-ar">ملاذ</div>
    <div class="sidebar-logo-en">MALAAZ</div>
    <div class="sidebar-badge">مقدم الخدمة</div>
  </div>
  <div class="sidebar-provider-info">
    <div class="prov-name" id="sb-prov-name">...</div>
    <div class="prov-type" id="sb-prov-type">...</div>
    <div class="prov-avail">
      <span class="avail-label">متاح الآن</span>
      <label class="toggle">
        <input type="checkbox" id="avail-toggle" onchange="toggleAvailability(this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">الرئيسية</div>
    <div class="nav-item active" onclick="showPage('overview')"><i class="fas fa-chart-bar"></i><span>نظرة عامة</span></div>
    <div class="nav-item" onclick="showPage('bookings')"><i class="fas fa-calendar-check"></i><span>حجوزاتي</span><span class="badge" id="new-bookings-badge" style="display:none">0</span></div>

    <div class="nav-section">إعداد الملف</div>
    <div class="nav-item" onclick="showPage('profile')"><i class="fas fa-user-md"></i><span>ملفي الشخصي</span></div>
    <div class="nav-item" onclick="showPage('services')"><i class="fas fa-layer-group"></i><span>خدماتي وأسعاري</span></div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn ghost" onclick="doLogout()" style="width:100%;font-size:13px"><i class="fas fa-sign-out-alt" style="margin-left:6px"></i> تسجيل الخروج</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
<div class="topbar">
  <div class="topbar-title" id="page-title">نظرة عامة</div>
  <div class="topbar-right">
    <button class="topbar-btn accent" onclick="saveAll()"><i class="fas fa-save" style="margin-left:6px"></i> حفظ</button>
  </div>
</div>
<div class="content">

<!-- ============================
     PAGE: OVERVIEW
     ============================ -->
<div class="page active" id="page-overview">
  <div class="stats-grid">
    <div class="stat-card"><div style="font-size:28px;margin-bottom:8px">📋</div><div class="stat-val" id="pov-all">—</div><div class="stat-lbl">إجمالي حجوزاتي</div></div>
    <div class="stat-card"><div style="font-size:28px;margin-bottom:8px">⏳</div><div class="stat-val" style="color:var(--danger)" id="pov-pending">—</div><div class="stat-lbl">حجوزات جديدة</div></div>
    <div class="stat-card"><div style="font-size:28px;margin-bottom:8px">✅</div><div class="stat-val" style="color:var(--green)" id="pov-completed">—</div><div class="stat-lbl">مكتملة</div></div>
  </div>

  <!-- Status card -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:15px;font-weight:700" id="pov-status-msg">جاري التحميل...</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px" id="pov-status-sub"></div>
      </div>
      <div id="pov-avail-badge"></div>
    </div>
  </div>

  <!-- Recent bookings -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">آخر حجوزاتي</div>
      <button class="btn primary" onclick="showPage('bookings')">عرض الكل</button>
    </div>
    <div class="card-body" id="overview-recent-bookings">
      <div style="text-align:center;padding:24px;color:var(--muted)">جاري التحميل...</div>
    </div>
  </div>
</div>

<!-- ============================
     PAGE: MY BOOKINGS
     ============================ -->
<div class="page" id="page-bookings">
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn primary active" id="bk-filter-all" onclick="filterMyBookings('all',this)" style="font-size:13px">الكل</button>
    <button class="btn ghost" id="bk-filter-pending" onclick="filterMyBookings('pending',this)" style="font-size:13px">جديد</button>
    <button class="btn ghost" id="bk-filter-confirmed" onclick="filterMyBookings('confirmed',this)" style="font-size:13px">مؤكد</button>
    <button class="btn ghost" id="bk-filter-completed" onclick="filterMyBookings('completed',this)" style="font-size:13px">مكتمل</button>
  </div>
  <div id="my-bookings-list">
    <div style="te
