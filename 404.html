<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاذ — الصفحة غير موجودة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#1e2c2f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{text-align:center;max-width:480px;}
.num{font-size:120px;font-weight:900;font-family:'Tajawal',sans-serif;color:#c9a84c;line-height:1;margin-bottom:8px;opacity:.9;}
.title{font-size:24px;font-weight:700;color:#fff;margin-bottom:12px;}
.sub{font-size:15px;color:rgba(255,255,255,.45);line-height:1.8;margin-bottom:32px;}
.btn{display:inline-block;background:#c9a84c;color:#1e2c2f;padding:14px 32px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:700;transition:all .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,168,76,.3);}
.logo{font-size:22px;font-weight:900;color:rgba(255,255,255,.15);font-family:'Tajawal',sans-serif;margin-bottom:32px;letter-spacing:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">MALAAZ — ملاذ</div>
  <div class="num">404</div>
  <div class="title">الصفحة غير موجودة</div>
  <div class="sub">الصفحة اللي بتدور عليها مش موجودة<br>ممكن اتحذفت أو الرابط غلط</div>
  <a href="/" class="btn">← الرجوع للرئيسية</a>
</div>
</body>
</html>
